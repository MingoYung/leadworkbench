name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      qt_smoke:
        description: Install desktop dependencies and check native Qt imports
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend / Python 3.12 / Windows
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64
      - name: Verify that site-packages and Qt are not required
        run: python -B -S -c "import importlib.util; assert importlib.util.find_spec('PySide6') is None"
      - name: Run isolated backend tests
        run: python -B -S -m unittest discover -s tests -v

  qt-smoke:
    name: Optional native imports / Python 3.12 / Windows
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.qt_smoke }}
    needs: backend
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install the pinned desktop runtime from PyPI
        run: >-
          python -m pip install --index-url https://pypi.org/simple
          --only-binary=:all: -r requirements-desktop.txt
      - name: Compile source
        run: python -m compileall -q leadworkbench tests
      - name: Import QtWidgets and native application modules
        run: >-
          python -B -c "import PySide6.QtCore, PySide6.QtGui, PySide6.QtWidgets, PySide6.QtNetwork;
          import leadworkbench.native_helpers, leadworkbench.native_presenters, leadworkbench.native_forms,
          leadworkbench.native_dialogs, leadworkbench.native_window;
          print('Native QtWidgets imports OK; no service, model, or browser was started')"
